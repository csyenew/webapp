name: Packer Custom Image Build & Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pytest-merge:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}

    env:
      DATABASE_URL: "mysql+mysqlconnector://root:${{ secrets.DB_PASSWORD }}@localhost:3306/${{ secrets.DB_NAME }}"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Ensure this file exists

      - name: Test with pytest
        run: pytest tests/ --maxfail=1 --disable-warnings -q  # Ensure the 'tests' directory contains valid test files

  check_format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y packer
          packer --version  # Verify installation
      - name: Check Packer file format
        run: |
          if ! packer fmt -check -diff .; then
            echo "Packer format is incorrect. Run 'packer fmt' locally."
            exit 1
          fi
      - name: Validate Packer Template
        run: |
          packer init .
          if ! packer validate .; then
            echo "Packer template validation failed!"
            exit 1
          fi

  packer-build:
    name: Packer Build
    runs-on: ubuntu-latest
    needs: [check_format]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install Packer
        run: sudo apt-get update && sudo apt-get install -y packer
      - name: Initialize Packer
        run: packer init .
      - name: Build Packer Image
        run: packer build packer-template.pkr.hcl

  update-launch-template:
    name: Update AWS Launch Template
    runs-on: ubuntu-latest
    needs: [packer-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl gnupg
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
          aws --version  # Verify AWS CLI installation

      - name: Get latest AMI ID
        id: ami_vars
        run: |
          latest_ami=$(aws ec2 describe-images --executable-users self --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text)
          echo "Latest AMI ID: $latest_ami"
          echo "latest_ami=$latest_ami" >> $GITHUB_ENV

          version_number=$(aws ec2 describe-launch-template-versions --launch-template-name asg_launch_config --query 'sort_by(LaunchTemplateVersions, &VersionNumber)[-1].VersionNumber' --output text)
          echo "version_number=$version_number" >> $GITHUB_ENV

      - name: Create new Launch Template version
        run: |
          aws ec2 create-launch-template-version --launch-template-name asg_launch_config \
            --launch-template-data "ImageId=${{ env.latest_ami }}" \
            --source-version ${{ env.version_number }}

      - name: Start AWS Auto Scaling Group Refresh
        run: |
          aws autoscaling start-instance-refresh --auto-scaling-group-name csye6225-asg-spring2023 --strategy Rolling \
            --desired-configuration '{"LaunchTemplate": {"LaunchTemplateName":"asg_launch_config", "Version":"$Latest"}}'

  setup-aws-gcp:
    name: Set Up AWS & GCP CLI
    runs-on: ubuntu-latest
    steps:
      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl gnupg
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
          aws --version  # Verify AWS CLI installation

      - name: Install GCP CLI
        run: |
          sudo apt-get install -y curl
          curl -O https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-441.0.0-linux-x86_64.tar.gz
          tar -xvf google-cloud-cli-441.0.0-linux-x86_64.tar.gz
          ./google-cloud-sdk/install.sh --quiet
          echo "export PATH=\$PATH:$(pwd)/google-cloud-sdk/bin" >> $GITHUB_ENV

      - name: Authenticate GCP CLI
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
 