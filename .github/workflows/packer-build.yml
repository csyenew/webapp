name: Packer Custom Image Build & Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check_format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y packer
          packer --version  # Verify installation
      - name: Check Packer file format
        run: |
          if ! packer fmt -check -diff .; then
            echo "Packer format is incorrect. Run 'packer fmt' locally."
            exit 1
          fi
      - name: Validate Packer Template
        run: |
          packer init .
          if ! packer validate .; then
            echo "Packer template validation failed!"
            exit 1
          fi

  build_image:
    name: Build Custom Image
    runs-on: ubuntu-latest
    needs: [check_format]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    if: github.event.pull_request.merged == true
    strategy:
      matrix:
        platform: [aws, gcp]  # Running for both AWS and GCP in parallel
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y packer
          packer --version  # Verify installation

      - name: Build Application Artifact
        run: |
          # Build your application artifact (war, jar, zip, etc.)
          # Assuming your artifact is a ZIP file
          zip -r app_artifact.zip ./path/to/your/application/files
          echo "Artifact built successfully"

      - name: Initialize Packer
        run: packer init .

      - name: Build Custom Image for ${{ matrix.platform }}
        run: |
          if [[ "${{ matrix.platform }}" == "aws" ]]; then
            # Build AWS image
            packer build aws-packer-template.pkr.hcl
          elif [[ "${{ matrix.platform }}" == "gcp" ]]; then
            # Build GCP image
            packer build gcp-packer-template.pkr.hcl
          fi

  setup-user-and-app:
    name: Set up User and Application
    runs-on: ubuntu-latest
    needs: [build_image]
    steps:
      - name: Create Non-login User
        run: |
          sudo groupadd csye6225
          sudo useradd -m -g csye6225 -s /usr/sbin/nologin csye6225

      - name: Install Application Dependencies
        run: |
          # Assuming your application needs to install dependencies (e.g., pip packages)
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install -r requirements.txt

      - name: Copy Application Artifacts
        run: |
          sudo cp app_artifact.zip /home/csye6225/
          sudo chown csye6225:csye6225 /home/csye6225/app_artifact.zip

      - name: Configure Systemd Service
        run: |
          # Assuming you have a systemd service file to add
          sudo cp your_service_file.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable your_service_file.service

      - name: Start Service
        run: |
          sudo systemctl start your_service_file.service

  update-launch-template:
    name: Update Launch Template
    runs-on: ubuntu-latest
    needs: [build_image]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install AWS CLI using Marketplace Action
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get latest AMI ID
        id: ami_vars
        run: |
          latest_ami=$(aws ec2 describe-images --executable-users self --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text)
          echo "Latest AMI ID: $latest_ami"
          echo "latest_ami=$latest_ami" >> $GITHUB_ENV

      - name: Create new Launch Template version
        run: |
          aws ec2 create-launch-template-version --launch-template-name asg_launch_config \
            --launch-template-data "ImageId=${{ env.latest_ami }}" \
            --source-version ${{ env.version_number }}

      - name: Start AWS Auto Scaling Group Refresh
        run: |
          aws autoscaling start-instance-refresh --auto-scaling-group-name csye6225-asg-spring2023 --strategy Rolling \
            --desired-configuration '{"LaunchTemplate": {"LaunchTemplateName":"asg_launch_config", "Version":"$Latest"}}'
