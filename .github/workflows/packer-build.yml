name: Packer CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  push:
    branches:
      - main

jobs:
  packer-fmt-validate:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y packer
          packer --version  # Verify installation

      - name: Run packer fmt
        run: |
          packer fmt -check -diff .
        continue-on-error: false

      - name: Run packer validate
        run: |
          packer validate .
        continue-on-error: false

  setup-aws-gcp:
    name: Set Up AWS & GCP CLI (Manually)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install AWS CLI manually
        run: |
          # Install the AWS CLI
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
          aws --version  # Verify installation

      - name: Configure AWS CLI credentials
        run: |
          # Ensure the .aws directory exists
          mkdir -p ~/.aws

          # Configure AWS CLI with the provided credentials
          echo "[default]" > ~/.aws/config
          echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "region=${{ secrets.AWS_REGION }}" >> ~/.aws/config

      - name: Install GCP CLI manually
        run: |
          # Install the GCP CLI (google-cloud-sdk)
          sudo apt-get update && sudo apt-get install -y curl gnupg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.com-archive-keyring.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo tee /usr/share/keyrings/cloud.google.com-archive-keyring.gpg
          sudo apt-get update && sudo apt-get install google-cloud-sdk
          gcloud --version  # Verify installation

      - name: Authenticate GCP CLI
        run: |
          # Authenticate GCP CLI using the service account key stored in GitHub secrets
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

  build:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [aws, gcp]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y packer
          packer --version  # Verify installation

      - name: Install AWS CLI
        uses: aws-actions/configure-aws-cli@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install GCP CLI
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          project_id: csye-dev-451921-452108

      - name: Run Integration Tests
        run: |
          # Add your integration test commands here
          echo "Running integration tests..."
          # Example: ./run-integration-tests.sh

      - name: Build Application Artifact
        run: |
          # Build your application artifact (e.g., war, jar, zip, etc.)
          zip -r app_artifact.zip app.py webapp.service
          echo "Artifact built successfully"

      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          name: app_artifact
          path: app_artifact.zip

      - name: Build Custom Image for ${{ matrix.platform }}
        run: |
          if [[ "${{ matrix.platform }}" == "aws" ]]; then
            # Build AWS image
            packer build -var 'aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}' -var 'aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}' -var 'artifact_path=app_artifact.zip' template.json
          elif [[ "${{ matrix.platform }}" == "gcp" ]]; then
            # Build GCP image
            packer build -var 'gcp_project_id=csye-dev-451921-452108' -var 'gcp_credentials_file=gcp-key.json' -var 'artifact_path=app_artifact.zip' template.json

      - name: Create local user csye6225
        run: |
          sudo useradd -r -s /usr/sbin/nologin -g csye6225 csye6225

      - name: Install application dependencies and setup application
        run: |
          # Install dependencies and copy application artifacts
          sudo mkdir -p /home/csye6225/webapp
          sudo unzip app_artifact.zip -d /home/csye6225/webapp
          sudo chown -R csye6225:csye6225 /home/csye6225/webapp

      - name: Add systemd service file
        run: |
          sudo cp /home/csye6225/webapp/webapp.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable webapp.service

  setup-user-and-app:
    name: Set Up User and Application
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Create Non-login User
        run: |
          sudo groupadd csye6225
          sudo useradd -m -g csye6225 -s /usr/sbin/nologin csye6225

      - name: Install Application Dependencies
        run: |
          # Assuming your application needs to install dependencies (e.g., pip packages)
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install -r requirements.txt

      - name: Copy Application Artifacts
        run: |
          sudo cp app_artifact.zip /home/csye6225/
          sudo chown csye6225:csye6225 /home/csye6225/app_artifact.zip

      - name: Configure Systemd Service
        run: |
          # Assuming you have a systemd service file to add
          sudo cp your_service_file.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable your_service_file.service

      - name: Start Service
        run: |
          sudo systemctl start your_service_file.service

  update-launch-template:
    name: Update Launch Template
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl gnupg
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
          aws --version  # Verify AWS CLI installation

      - name: Get latest AMI ID
        id: ami_vars
        run: |
          latest_ami=$(aws ec2 describe-images --executable-users self --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text)
          echo "Latest AMI ID: $latest_ami"
          echo "latest_ami=$latest_ami" >> $GITHUB_ENV

          version_number=$(aws ec2 describe-launch-template-versions --launch-template-name asg_launch_config --query 'sort_by(LaunchTemplateVersions, &VersionNumber)[-1].VersionNumber' --output text)
          echo "version_number=$version_number" >> $GITHUB_ENV

      - name: Create new Launch Template version
        run: |
          aws ec2 create-launch-template-version --launch-template-name asg_launch_config \
            --launch-template-data "ImageId=${{ env.latest_ami }}" \
            --source-version ${{ env.version_number }}

      - name: Start AWS Auto Scaling Group Refresh
        run: |
          aws autoscaling start-instance-refresh --auto-scaling-group-name csye6225-asg-spring2023 --strategy Rolling \
            --desired-configuration '{"LaunchTemplate": {"LaunchTemplateName":"asg_launch_config", "Version":"$Latest"}}'
