name: Packer Build

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  packer-build:
    name: Packer Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Packer Manually
        run: |
          PACKER_VERSION="1.8.0"
          PACKER_URL="https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"

          sudo rm -rf /usr/local/bin/packer
          wget -q "${PACKER_URL}" -O packer.zip
          sudo unzip -o packer.zip -d /usr/local/bin/
          rm packer.zip
          packer version

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install
          aws --version

      - name: Initialize Packer
        run: packer init packer/debian.pkr.hcl

      - name: Build Packer Image
        run: packer build packer/debian.pkr.hcl
 