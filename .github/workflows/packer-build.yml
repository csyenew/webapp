name: Packer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  packer-fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common wget unzip
          wget https://releases.hashicorp.com/packer/1.8.0/packer_1.8.0_linux_amd64.zip
          unzip packer_1.8.0_linux_amd64.zip
          sudo mv packer /usr/local/bin/
          packer --version  # Verify installation

      - name: Run Packer Init
        run: packer init .

      - name: Run Packer Formatting Check
        run: packer fmt .
        continue-on-error: false

      - name: Run Packer Validate
        run: packer validate .
        continue-on-error: false

  packer-build:
    needs: [packer-fmt-validate]  # Ensure validation passes before building
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [aws, gcp]  # Build images for AWS and GCP in parallel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common wget unzip
          wget https://releases.hashicorp.com/packer/1.8.0/packer_1.8.0_linux_amd64.zip
          unzip packer_1.8.0_linux_amd64.zip
          sudo mv packer /usr/local/bin/
          packer --version  # Verify installation

      # ✅ Configure AWS CLI
      - name: Configure AWS CLI
        if: matrix.platform == 'aws'
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region=us-east-1" >> ~/.aws/config

      # ✅ Store and Validate GCP Credentials
      - name: Store GCP Credentials
        if: matrix.platform == 'gcp'
        run: |
          if [[ -z "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" ]]; then
            echo "❌ ERROR: GOOGLE_APPLICATION_CREDENTIALS_JSON is empty!"
            exit 1
          fi

          # Write JSON directly to file (without base64 decoding)
          printf '%s' "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > $HOME/gcp-key.json

          # Ensure the file exists
          if [[ ! -f "$HOME/gcp-key.json" ]]; then
            echo "❌ ERROR: gcp-key.json file was not created!"
            exit 1
          fi

          # Validate JSON format
          if ! jq empty "$HOME/gcp-key.json" > /dev/null 2>&1; then
            echo "❌ ERROR: Invalid JSON in gcp-key.json!"
            cat $HOME/gcp-key.json  # Print JSON for debugging
            exit 1
          fi

          # Export GOOGLE_APPLICATION_CREDENTIALS for later steps
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV
          echo "✅ GCP credentials stored successfully."

      # ✅ Debug GCP Credentials File
      - name: Debug GCP Credentials File
        if: matrix.platform == 'gcp'
        run: |
          echo "🔍 Checking GOOGLE_APPLICATION_CREDENTIALS variable..."
          echo "GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS"

          echo "🔍 Checking if credentials file exists..."
          ls -l $HOME/gcp-key.json || echo "❌ gcp-key.json not found!"

          echo "🔍 First 100 characters of key file:"
          head -c 100 $HOME/gcp-key.json || echo "❌ gcp-key.json is empty!"

          echo "🔍 Validating JSON format..."
          cat $HOME/gcp-key.json | jq . || echo "❌ Invalid JSON!"

      # ✅ Build the Application Artifact
      - name: Build Application Artifact
        run: |
          zip -r app_artifact.zip app.py config.py packer-template.pkr.hcl requirements.txt webapp.service
          echo "Artifact built successfully"

      # ✅ Run Packer Init
      - name: Run Packer Init
        run: packer init .

      # ✅ Ensure GCP Credentials Exist Before Packer Build
      - name: Ensure GCP Credentials Exist Before Packer Build
        if: matrix.platform == 'gcp'
        run: |
          if [[ ! -f "$HOME/gcp-key.json" ]]; then
            echo "❌ ERROR: gcp-key.json file not found!"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV
          echo "✅ GCP credentials ready for Packer."

      # ✅ Run Packer Build for AWS & GCP
      - name: Build AWS & GCP Images with Packer
        run: |
          echo "Using GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS"

          if [[ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]]; then
            echo "❌ ERROR: GOOGLE_APPLICATION_CREDENTIALS file not found!"
            exit 1
          fi

          packer build .

  update-launch-template:
    name: Update Launch Template
    runs-on: ubuntu-latest
    needs: [packer-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create new Launch Template version
        run: |
          aws ec2 create-launch-template-version --launch-template-name asg_launch_config \
            --launch-template-data "ImageId=${{ env.latest_ami }}" \
            --source-version ${{ env.version_number }}

      - name: Start AWS Auto Scaling Group Refresh
        run: |
          aws autoscaling start-instance-refresh --auto-scaling-group-name csye6225-asg-spring2023 --strategy Rolling \
            --desired-configuration '{"LaunchTemplate": {"LaunchTemplateName":"asg_launch_config", "Version":"$Latest"}}'
