name: Packer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  packer-fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common wget unzip
          wget https://releases.hashicorp.com/packer/1.8.0/packer_1.8.0_linux_amd64.zip
          unzip packer_1.8.0_linux_amd64.zip
          sudo mv packer /usr/local/bin/
          packer --version  # Verify installation

      - name: Run Packer Init
        run: packer init .

      - name: Run Packer Formatting Check
        run: packer fmt .
        continue-on-error: false

      - name: Run Packer Validate
        run: packer validate .
        continue-on-error: false

  packer-build:
    needs: [packer-fmt-validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [aws, gcp]  # Run AWS & GCP builds in parallel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common wget unzip
          wget https://releases.hashicorp.com/packer/1.8.0/packer_1.8.0_linux_amd64.zip
          unzip packer_1.8.0_linux_amd64.zip
          sudo mv packer /usr/local/bin/
          packer --version  # Verify installation

      - name: Install AWS CLI (if building AWS)
        if: matrix.provider == 'aws'
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Install GCP CLI (if building GCP)
        if: matrix.provider == 'gcp'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli
          gcloud --version

      - name: Configure AWS CLI (if building AWS)
        if: matrix.provider == 'aws'
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region=us-east-1" >> ~/.aws/config

      - name: Decode and Store GCP Credentials (if building GCP)
        if: matrix.provider == 'gcp'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" | base64 --decode > $HOME/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV
          gcloud auth activate-service-account --key-file=$HOME/gcp-key.json
          gcloud config set project "$(jq -r '.project_id' $HOME/gcp-key.json)"

      - name: Verify GCP Authentication (if building GCP)
        if: matrix.provider == 'gcp'
        run: |
          gcloud auth list
          gcloud compute instances list --limit=5 || echo "Unable to list instances (might be a permissions issue)"

      - name: Run Packer Init
        run: packer init .

      - name: Build AWS & GCP Images with Packer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/gcp-key.json
        run: |
          packer build -only="source.${{ matrix.provider }}-*"

  update-launch-template:
    name: Update Launch Template
    runs-on: ubuntu-latest
    needs: [packer-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Retrieve Latest AMI ID (for AWS)
        run: |
          LATEST_AMI_ID=$(aws ec2 describe-images --owners self --query 'Images[*].[ImageId]' --output text | tail -n1)
          echo "Latest AMI: $LATEST_AMI_ID"
          echo "LATEST_AMI_ID=$LATEST_AMI_ID" >> $GITHUB_ENV

      - name: Create new Launch Template version
        run: |
          aws ec2 create-launch-template-version --launch-template-name asg_launch_config \
            --launch-template-data "ImageId=${{ env.LATEST_AMI_ID }}" \
            --source-version ${{ env.version_number }}

      - name: Start AWS Auto Scaling Group Refresh
        run: |
          aws autoscaling start-instance-refresh --auto-scaling-group-name csye6225-asg-spring2023 --strategy Rolling
