name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: csye6225
          MYSQL_USER: appuser
          MYSQL_PASSWORD: ds220401
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Set Environment Variables
        run: |
          echo "SQLALCHEMY_DATABASE_URI=mysql+mysqlconnector://appuser:AppPassword123!@127.0.0.1:3306/csye6225" >> $GITHUB_ENV

      - name: Run Database Migrations
        run: |
          source venv/bin/activate
          flask db upgrade

      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest
