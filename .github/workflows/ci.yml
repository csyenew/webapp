name: CI Pipeline
on:
  pull_request:
    branches:
      - main
jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test with pytest
        run: pytest

  check_packer_format:
    name: Packer Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install Packer Manually
        run: |
          PACKER_VERSION="1.8.0"
          PACKER_URL="https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          sudo rm -rf /usr/local/bin/packer
          wget -q "${PACKER_URL}" -O packer.zip
          sudo unzip -o packer.zip -d /usr/local/bin/
          rm packer.zip
          packer version
          
      - name: Check Packer Format
        run: |
          if ! packer fmt -check packer/debian.pkr.hcl; then
            echo "Packer format is incorrect. Please run 'packer fmt' locally."
            exit 1
          fi
          
      - name: Validate Packer Configuration
        run: |
          packer init packer/debian.pkr.hcl
          if ! packer validate packer/debian.pkr.hcl; then
            echo "Packer configuration is not valid."
            exit 1
          fi