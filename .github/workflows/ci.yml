name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ds  # Updated database name to 'ds'
          MYSQL_USER: appuser
          MYSQL_PASSWORD: ds220401
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      # Set environment variable for SQLAlchemy with the correct database name
      - name: Set Environment Variables
        run: |
          echo "SQLALCHEMY_DATABASE_URI=mysql+mysqlconnector://appuser:ds220401@127.0.0.1:3306/ds" >> $GITHUB_ENV  # Updated database name to 'ds'

      # Run database migrations (e.g., for Flask-Migrate)
      - name: Run Database Migrations
        run: |
          source venv/bin/activate
          flask db upgrade

      # Run tests using pytest
      - name: Run Tests
        run: |
          source venv/bin/activate
          pytest  # You may adjust the pytest command if needed, e.g., specifying paths or configurations
