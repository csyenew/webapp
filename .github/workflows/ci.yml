name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ds220401
          MYSQL_DATABASE: ds
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          # Create virtual environment
          python -m venv venv
          
          # Activate virtual environment
          source venv/bin/activate
          
          # Install dependencies
          pip install -r requirements.txt
          pip install flask  # Ensure Flask is installed

      - name: Wait for MySQL to be Ready
        run: |
          echo "Waiting for MySQL to start..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is up!"
              break
            fi
            echo "MySQL is unavailable - sleeping"
            sleep 2
          done

      - name: Set Environment Variables
        run: |
          echo "SQLALCHEMY_DATABASE_URI=mysql+mysqlconnector://root:ds220401@127.0.0.1:3306/ds" >> $GITHUB_ENV

      - name: Initialize Migrations (if not present)
        run: |
          source venv/bin/activate  # Ensure virtual environment is activated
          if [ ! -d "migrations" ]; then
            flask db init
          fi 

      - name: Run Database Migrations
        run: |
          source venv/bin/activate  # Ensure virtual environment is activated
          flask db migrate -m "Initial migration" || true  # Allow failure if no changes
          flask db upgrade

      # Skip the pytest step if you don't want automated tests
